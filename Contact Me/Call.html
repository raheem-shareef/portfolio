<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="../style.css"/>
</head>
<body>
    <header>
        <h1 id="call">Contact Me</h1>
    </header>
    <main id="imp">
        <div id="text">
            <h2>For any queries or help, fill out the form below:</h2>
        </div>
        <br>
        <section id="form">
            <form id="contact-form" action="/action.php">
                <label for="naam">
                    <input type="text" placeholder="Enter Your Name" id="naam">
                </label>
                <br>
                <br>
                <label for="mail">
                    <input type="email" placeholder="Enter Your Email" id="mail">
                </label>
                <br><br>
                <label for="number">
                    <input type="number" placeholder="Enter your Mobile Number" id="number">
                </label>
                <br><br>
                <label for="feedback">
                    <textarea name="Feedback" placeholder="Enter your Feedback" id="feedback" cols="10" rows="5"></textarea>
                </label>
                <br><br>
                <input type="submit" value="submit" id="sub">
                <input type="reset" value="Reset" id="res">
            </form>
        </section>
    </main>
    <footer>
        <section id="footer">
            <p id="para">Thanks For Visiting!</p>
            <a href="/index.html"><img src="/Coding Profile.png" height="150px" alt="Back to portfolio" id="img"></a>
        </section>
    </footer>
</body>
</html>
